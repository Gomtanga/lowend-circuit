name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release tag to upload Windows assets to"
        required: false
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone and VST3
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "manual"
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $standaloneSource = "build/LowEndCircuit_artefacts/Release/Standalone/LowEnd Circuit.exe"
          $standaloneDir = "dist/LowEnd-Circuit-Standalone-Windows-$version"
          New-Item -ItemType Directory -Force -Path $standaloneDir | Out-Null
          Copy-Item $standaloneSource "$standaloneDir/LowEnd Circuit.exe"
          @"
          LowEnd Circuit Standalone for Windows

          Run "LowEnd Circuit.exe" as a normal desktop audio app.
          This build does not include system-wide Windows audio capture.
          "@ | Set-Content -Encoding UTF8 "$standaloneDir/README.txt"
          Compress-Archive -Path $standaloneDir -DestinationPath "dist/LowEnd-Circuit-Standalone-Windows-$version.zip" -Force

          $vst3Source = "build/LowEndCircuit_artefacts/Release/VST3/LowEnd Circuit.vst3"
          $vst3Dir = "dist/LowEnd-Circuit-VST3-Windows-$version"
          New-Item -ItemType Directory -Force -Path $vst3Dir | Out-Null
          Copy-Item $vst3Source "$vst3Dir/LowEnd Circuit.vst3" -Recurse
          @"
          LowEnd Circuit VST3 for Windows

          Copy "LowEnd Circuit.vst3" to your VST3 plugin folder, usually:
          C:\Program Files\Common Files\VST3
          "@ | Set-Content -Encoding UTF8 "$vst3Dir/README.txt"
          Compress-Archive -Path $vst3Dir -DestinationPath "dist/LowEnd-Circuit-VST3-Windows-$version.zip" -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LowEnd-Circuit-Windows
          path: dist/*.zip

      - name: Upload to GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "${{ github.ref_name }}"
          }
          gh release upload $tag dist/*.zip --clobber
